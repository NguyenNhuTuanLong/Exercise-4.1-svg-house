<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - Draw SVGs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        svg {
            border: 2px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Exercise 4.1: Draw SVGs</h1>

    <svg width="500" height="500">
        <rect x="0" y="0" width="500" height="300" fill="#87CEEB" />

        <rect x="0" y="300" width="500" height="200" fill="#008000" />

        <circle cx="420" cy="80" r="35" fill="#FFFF00" />

        <rect x="180" y="180" width="140" height="120" fill="#A0522D" />

        <polygon points="160,180 250,100 340,180" fill="#D2691E" />

        <rect x="235" y="240" width="30" height="60" fill="#8B4513" />
        <circle cx="240" cy="270" r="3" fill="#000000" />

        <rect x="70" y="210" width="20" height="90" fill="#8B4513" />
        <circle cx="65" cy="180" r="25" fill="#228B22" />
        <circle cx="95" cy="180" r="25" fill="#228B22" />
        <polygon points="40,190 120,190 80,230" fill="#228B22" />

        <path d="M 235 300 Q 210 380 180 500" stroke="#FFD700" stroke-width="6" fill="none" />
        <path d="M 265 300 Q 240 380 220 500" stroke="#FFD700" stroke-width="6" fill="none" />

        <text x="350" y="250" font-family="sans-serif" font-size="20" font-weight="bold" fill="#000000">House</text>
    </svg>

</body>
</html>
