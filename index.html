<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - House and Garden</title>
    <style>
        body { margin: 8px; }
        svg { display: block; }
    </style>
</head>
<body>

<svg width="494" height="491" viewBox="0 0 988 982" xmlns="http://www.w3.org/2000/svg">
    <!-- Bầu trời -->
    <rect x="0" y="0" width="988" height="982" fill="#87CEEB" />

    <!-- Cỏ -->
    <rect x="0" y="599" width="988" height="383" fill="#008000" />

    <!-- Mặt trời -->
    <circle cx="798" cy="199" r="80" fill="#FFFF00" />

    <!-- Thân cây -->
    <rect x="158" y="499" width="40" height="200" fill="#A0522D" />

    <!-- Tán cây (3 hình tròn) -->
    <g fill="#228B22">
        <circle cx="138" cy="419" r="60" />
        <circle cx="218" cy="419" r="60" />
        <circle cx="178" cy="459" r="60" />
    </g>

    <!-- Thân nhà -->
    <rect x="298" y="399" width="400" height="300" fill="#8B4513" />

    <!-- Mái nhà -->
    <polygon points="498,199 298,399 698,399" fill="#CD853F" />

    <!-- Cửa sổ -->
    <g fill="#ADD8E6">
        <rect x="338" y="439" width="80" height="80" />
        <rect x="578" y="439" width="80" height="80" />
    </g>

    <!-- Cửa chính + tay nắm -->
    <rect x="458" y="539" width="80" height="160" fill="#A0522D" />
    <circle cx="518" cy="619" r="10" fill="#000000" />

    <!-- Lối đi (2 đường cong) -->
    <g fill="none" stroke="#FFA500" stroke-width="10">
        <path d="M 470 699 C 330 725 255 765 280 815 C 310 875 420 910 462 982" />
        <path d="M 535 699 C 380 725 320 760 330 805 C 345 860 500 910 555 982" />
    </g>

    <!-- Chữ -->
    <text x="758" y="580" font-family="Verdana, Arial, sans-serif" font-size="48" fill="#000000">House</text>
</svg>

</body>
</html>
